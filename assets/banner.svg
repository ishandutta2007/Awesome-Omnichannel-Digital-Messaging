<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glowing Pill Gradients -->
    <linearGradient id="pill-sms" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="pill-wa" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="pill-rcs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="pill-chat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #a5b4fc;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #ffffff;
    }

    /* Floating Keyframes */
    @keyframes floatSlow1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }
    @keyframes floatSlow2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1.5deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }

    .float-1 { animation: floatSlow1 7s ease-in-out infinite; }
    .float-2 { animation: floatSlow2 8.5s ease-in-out infinite; }
    .float-3 { animation: floatSlow1 6s ease-in-out infinite reverse; }
    .float-4 { animation: floatSlow2 9s ease-in-out infinite reverse; }
    .pulse-orb { transform-origin: center; animation: pulseGlow 6s ease-in-out infinite; }
    .dash-flow { stroke-dasharray: 8 6; animation: flowLine 15s linear infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Background Orbs (Non-obstructing, behind content) -->
  <circle class="pulse-orb" cx="150" cy="180" r="130" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle class="pulse-orb" cx="1060" cy="180" r="140" fill="#ec4899" opacity="0.2" filter="url(#glow)" />
  <circle class="pulse-orb" cx="600" cy="60" r="110" fill="#8b5cf6" opacity="0.18" filter="url(#glow)" />

  <!-- Ambient Dynamic Connecting Data Pathways (Behind text) -->
  <g opacity="0.45">
    <path class="dash-flow" d="M 60 280 C 220 280, 240 80, 480 80 C 720 80, 820 290, 1140 290" fill="none" stroke="url(#primary-grad)" stroke-width="2.5" />
    <path class="dash-flow" d="M 90 90 C 280 90, 420 300, 680 300 C 940 300, 1020 110, 1120 110" fill="none" stroke="#6366f1" stroke-width="1.8" opacity="0.6" style="animation-direction: reverse;" />
  </g>

  <!-- Animated Interactive Dynamic Channel Badges (Flanking corners, preserving center clarity) -->
  <!-- Left Side Badges -->
  <g class="float-1" transform="translate(60, 65)">
    <rect width="135" height="42" rx="21" fill="url(#pill-wa)" stroke="#10b981" stroke-width="1.2" filter="url(#soft-glow)" />
    <circle cx="24" cy="21" r="7" fill="#10b981" />
    <text x="42" y="26" class="pill-label">WhatsApp</text>
  </g>

  <g class="float-2" transform="translate(45, 235)">
    <rect width="115" height="42" rx="21" fill="url(#pill-sms)" stroke="#3b82f6" stroke-width="1.2" filter="url(#soft-glow)" />
    <circle cx="24" cy="21" r="7" fill="#3b82f6" />
    <text x="42" y="26" class="pill-label">SMS / MMS</text>
  </g>

  <!-- Right Side Badges -->
  <g class="float-3" transform="translate(1005, 75)">
    <rect width="135" height="42" rx="21" fill="url(#pill-rcs)" stroke="#8b5cf6" stroke-width="1.2" filter="url(#soft-glow)" />
    <circle cx="24" cy="21" r="7" fill="#8b5cf6" />
    <text x="42" y="26" class="pill-label">RCS &amp; In-App</text>
  </g>

  <g class="float-4" transform="translate(1025, 235)">
    <rect width="125" height="42" rx="21" fill="url(#pill-chat)" stroke="#f59e0b" stroke-width="1.2" filter="url(#soft-glow)" />
    <circle cx="24" cy="21" r="7" fill="#f59e0b" />
    <text x="42" y="26" class="pill-label">Live Chat</text>
  </g>

  <!-- Central Foreground Content (High contrast, clearly legible) -->
  <g transform="translate(600, 110)" text-anchor="middle">
    <!-- Category Pill Tag -->
    <rect x="-170" y="-45" width="340" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="0" y="-25" class="tagline-text" text-anchor="middle">⚡ Unified Communications Ecosystem</text>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="35" class="title-text" text-anchor="middle">
      Omnichannel Digital Messaging
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" class="subtitle-text" text-anchor="middle">
      Curated Landscape of SaaS Platforms &amp; Open-Source Messaging Infrastructure
    </text>

    <!-- Highlights Badges -->
    <g transform="translate(0, 125)">
      <rect x="-240" y="-12" width="110" height="26" rx="13" fill="#1e293b" stroke="#334155" />
      <text x="-185" y="5" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600" text-anchor="middle">🚀 SaaS Leaders</text>

      <rect x="-115" y="-12" width="120" height="26" rx="13" fill="#1e293b" stroke="#334155" />
      <text x="-55" y="5" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600" text-anchor="middle">💻 Open Source</text>

      <rect x="20" y="-12" width="115" height="26" rx="13" fill="#1e293b" stroke="#334155" />
      <text x="77" y="5" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600" text-anchor="middle">📊 Market Data</text>

      <rect x="150" y="-12" width="100" height="26" rx="13" fill="#1e293b" stroke="#334155" />
      <text x="200" y="5" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600" text-anchor="middle">⭐ Star Counts</text>
    </g>
  </g>
</svg>
